AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  MyIp:
    Type: String
    Description:
Resources:
  MySecurityGroup: 
    Type: AWS::EC2::SecurityGroup
    Properties:
        GroupDescription: My security group
        GroupName: Nume Real2
        Tags: 
          - Key: Name
            Value: MySecurityGroup
        VpcId: vpc-0ed70ed96979972c8 
        SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 1.2.3.4/32
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
  MyEc2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0567589d25e06853e
      InstanceType: t3.micro
      KeyName: aws
      SecurityGroupIds:
      - !Ref MySecurityGroup
      SubnetId: subnet-0b0ab85450897464a